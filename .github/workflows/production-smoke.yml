name: Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify HTTPS, CORS, WebSocket and lobby session flow
        env:
          VAMPIRKY_BACKEND_URL: https://vampirky-backend-production.up.railway.app
          VAMPIRKY_SMOKE_ORIGIN: https://mehmetyildiz03.github.io
        run: npm run smoke:production -- "$VAMPIRKY_BACKEND_URL"
